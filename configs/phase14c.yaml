authorization:
  stage: synthetic_integrity_and_same_data_memorization_only
  student_training: true
  training_split_only: true
  heldout_access: false
  dagger: false
  world_model: false
  reserve_access: false

features:
  raw_width: 52
  variants: [raw52, raw52_plus_physics9]
  future_information: forbidden
  physics9:
    - goal_relative_dx_normalized
    - goal_relative_dy_normalized
    - goal_distance_world_diagonal_normalized
    - speed_fraction_of_max
    - forward_velocity_toward_goal_fraction_of_max
    - lateral_velocity_fraction_of_max
    - velocity_goal_alignment_cosine
    - nearest_obstacle_clearance_world_diagonal_normalized
    - discrete_greedy_braking_distance_world_diagonal_normalized
  braking_definition: "simulate the legal primitive action minimizing next speed squared (action-ID tie-break), applying exact damping, acceleration, diagonal normalization, and max-speed clipping; sum traveled distance until speed <= safe_speed or 128 steps, then normalize by world diagonal"

targets:
  variants: [within_state_normalized_regret9, standardized_structured_objective27]
  objective_components: [terminal_class, conditional_primary_cost, total_noncoast_effort]
  q_standardization: "one mean/std per component pooled across fitting states and nine actions; std floor 1e-8; invert before lexicographic evaluation"
  regret: "stored exact target (average_rank - best_average_rank) / 8"
  student_selection: "argmin predicted objective tuple or predicted regret; deterministic lowest action-ID tie-break"
  near_tie_exclusion: "for pairwise-order score only: different terminal classes are always clear; within a class, pairs whose primary-cost gap is <=1 step for success or <=0.01 distance for failure are ignored; near-tie exclusion does not alter targets or decision regret"

learner_families:
  nearest_neighbor:
    type: NumPy_1NN_regressor
    neighbors: 1
    distance: euclidean_after_fitting_only_standardization
  decision_tree:
    type: NumPy_multioutput_CART_squared_error
    max_depth: unbounded
    min_samples_leaf: 1
    random_state: 141400
  tiny_mlp:
    type: NumPy_MLPRegressor
    hidden_layer_sizes: [64, 64]
    activation: relu
    optimizer: Adam
    alpha: 0.0001
    batch_size: 64
    learning_rate_init: 0.001
    max_epochs: 3000
    tol: 0.000001
    plateau_patience_epochs: 200
    validation_early_stopping: false
    random_state: 141400
    max_parameters: 10000

memorization:
  ladder: [diagnostic_1, diagnostic_8, diagnostic_32, one_layout, full_training]
  diagnostic_states: "nested query keys in phase14_training_source_audit_v2.diagnostic_state_keys order"
  one_layout: "all rows whose source_episode_seed equals phase14_training_source_audit_v2.one_layout_seed"
  full_training: "all 2,095 source rows"
  target_and_feature_variants: all_cartesian_combinations
  advancement:
    max_mean_normalized_decision_regret: 0.01
    minimum_clear_pair_order_accuracy: 0.99
    at_least_one_learner_must_pass_each_rung_and_each_feature_target_combination: true
  synthetic_integrity:
    input_rule: "on a balanced grid of deployable numeric inputs, action 1 is preferred when vx > 0.2; action 2 is preferred otherwise; other actions have strictly worse targets"
    use_same_feature_transformer_model_factory_and_evaluator: true
    require_zero_training_decision_regret_for_tree_and_1nn: true
    require_mlp_correct_non_tied_ordering: true

scope:
  heldout_layouts_opened: false
  closed_loop: false
  dagger: false
  learned_world_model: false
  reserve: false

resources:
  device: cpu
  wall_time_cap: null
  generated_storage_cap: null
  overwrite_forbidden: true

