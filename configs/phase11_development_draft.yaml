primary_outcome:
  name: paired_safe_success_rate_difference
  practical_minimum_absolute_gain: 0.10
  pass_headroom:
    point_gain_at_least: 0.10
    paired_layout_bootstrap_95_percent_lower_bound_gain_above: 0.0
    collision_rate_difference_95_percent_upper_bound_at_most: 0.02
  pass_amortization_motivation:
    median_planner_to_comparator_wall_latency_per_decision_ratio_at_least: 10.0
  bootstrap:
    resamples: 10000
    seed: 110011
    unit: layout_sha256
    paired_methods: true
  interpretation: Apply the declared headroom and amortization gates without retuning. If a gate fails or is inconclusive, do not train a student from this task.

