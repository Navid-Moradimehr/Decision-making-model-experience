project:
  name: consequence-lab
  phase: 5A
  protocol: popgym_minesweeper_easy_baseline_screen_v1
  authorization: D048_training_seed_baseline_screen_only
  validation_or_test_access_authorized: false
  teacher_label_generation_authorized: false
  student_training_authorized: false
  calibration_fit_authorized: false
  max_total_cpu_seconds: 600
  max_generated_artifact_bytes: 100000000

environment:
  package: popgym
  version: 1.0.7
  source_revision: 96ab5be64f41587feab634dbc115ad7be8bdd094
  wheel_sha256: 23be7f754f3167f58c4ac844426f3e0f7230035bedfcd5d85b004524eef21bb6
  python_version: 3.11.15
  gymnasium_version: 1.3.0
  numpy_version: 2.4.6
  task: MineSweeperEasy
  board_shape: [4, 4]
  mine_count: 2
  seed_start: 260000
  seed_count: 100
  candidate_id: row_major_cell_index
  runtime_information: revealed_cell_mask_and_neighbor_counts
  hidden_information_forbidden_at_decision_time: [hidden_grid, mine_locations, simulator_state]

baselines:
  methods:
    - random_unrevealed
    - row_major_first_unrevealed
    - exact_posterior_min_risk
    - exact_posterior_min_risk_then_information_gain
  random_seed_salt: consequence-lab/phase5/minesweeper/random-v1
  posterior_layout_prior: uniform_over_two_mine_subsets
  information_gain: expected_reduction_in_layout_entropy_conditioned_on_safe_reveal
  candidate_tie_break: stable_cell_id

statistics:
  episode_unit: seed
  paired_bootstrap_replicates: 10000
  paired_bootstrap_seed: 505001
  interval: percentile_95
  report_metrics: [win_rate, mean_return, mean_safe_reveals, mean_actions, cpu_seconds]

artifacts:
  run_directory: artifacts/runs/phase5_minesweeper_candidate_screen_v1
  refuse_overwrite: true
  save_episode_outcomes: true
  save_policy_risk_predictions: true
  save_hidden_board: false
  official_test_split: nonexistent_for_this_procedural_screen
